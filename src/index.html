<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Items</title>
<style>
  body { font: 16px system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input { flex: 1; padding: .5rem; }
  button { padding: .5rem .8rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: .4rem 0; border-bottom: 1px solid #ddd; }
  #error { color: #b00020; min-height: 1.2em; }
  #status { color: #666; font-size: .85rem; }
</style>
</head>
<body>
<h1>Items</h1>
<form id="form">
  <input id="name" placeholder="New item name" autocomplete="off" required>
  <button>Add</button>
</form>
<p id="error"></p>
<ul id="list"></ul>
<p id="status"></p>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function refresh() {
  const items = await api('/items');
  const list = $('list');
  list.replaceChildren(...items.map((item) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = item.name;
    const del = document.createElement('button');
    del.textContent = 'Delete';
    del.onclick = () => run(() => api('/items/' + item.id, { method: 'DELETE' }));
    li.append(span, del);
    return li;
  }));
}

async function run(action) {
  $('error').textContent = '';
  try { await action(); await refresh(); } catch (e) { $('error').textContent = e.message; }
}

$('form').onsubmit = (e) => {
  e.preventDefault();
  run(async () => {
    await api('/items', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: $('name').value }),
    });
    $('name').value = '';
  });
};

api('/health').then((h) => { $('status').textContent = 'Server ok, uptime ' + Math.round(h.uptime) + 's'; }).catch(() => {});
run(() => Promise.resolve());
</script>
</body>
</html>
